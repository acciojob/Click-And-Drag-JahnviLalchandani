<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Click and Drag</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="items">
    <div class="item item1">01</div>
    <div class="item item2">02</div>
    <div class="item item3">03</div>
    <div class="item item4">04</div>
    <div class="item item5">05</div>
    <div class="item item6">06</div>
    <div class="item item7">07</div>
    <div class="item item8">08</div>
    <div class="item item9">09</div>
    <div class="item item10">10</div>
    <div class="item item11">11</div>
    <div class="item item12">12</div>
    <div class="item item13">13</div>
    <div class="item item14">14</div>
    <div class="item item15">15</div>
    <div class="item item16">16</div>
    <div class="item item17">17</div>
    <div class="item item18">18</div>
    <div class="item item19">19</div>
    <div class="item item20">20</div>
    <div class="item item21">21</div>
    <div class="item item22">22</div>
    <div class="item item23">23</div>
    <div class="item item24">24</div>
    <div class="item item25">25</div>
  </div>

<script>
//Your code goes here 
	
const container = document.querySelector(".items");
const items = document.querySelectorAll(".item");

let selectedItem = null;
let offsetX = 0;
let offsetY = 0;

// Select an item
items.forEach(item => {

    item.addEventListener("mousedown", function(e) {

        selectedItem = item;

        const itemRect = item.getBoundingClientRect();

        offsetX = e.clientX - itemRect.left;
        offsetY = e.clientY - itemRect.top;

        const containerRect = container.getBoundingClientRect();

        item.style.position = "absolute";

        item.style.left = (itemRect.left - containerRect.left) + "px";
        item.style.top = (itemRect.top - containerRect.top) + "px";

        item.style.zIndex = 100;

    });

});

// Move selected item
document.addEventListener("mousemove", function(e) {

    if (selectedItem === null) {
        return;
    }

    const containerRect = container.getBoundingClientRect();

    let x = e.clientX - containerRect.left - offsetX;
    let y = e.clientY - containerRect.top - offsetY;

    // Set boundaries
    const maxX = container.clientWidth - selectedItem.offsetWidth;
    const maxY = container.clientHeight - selectedItem.offsetHeight;

    x = Math.max(0, Math.min(x, maxX));
    y = Math.max(0, Math.min(y, maxY));

    selectedItem.style.left = x + "px";
    selectedItem.style.top = y + "px";

});

// Release item
document.addEventListener("mouseup", function() {

    if (selectedItem !== null) {
        selectedItem.style.zIndex = 1;
        selectedItem = null;
    }

});

</script>

  </body>
</html>
