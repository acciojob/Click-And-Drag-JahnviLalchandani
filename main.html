<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Click and Drag</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="items">
    <div class="item item1">01</div>
    <div class="item item2">02</div>
    <div class="item item3">03</div>
    <div class="item item4">04</div>
    <div class="item item5">05</div>
    <div class="item item6">06</div>
    <div class="item item7">07</div>
    <div class="item item8">08</div>
    <div class="item item9">09</div>
    <div class="item item10">10</div>
    <div class="item item11">11</div>
    <div class="item item12">12</div>
    <div class="item item13">13</div>
    <div class="item item14">14</div>
    <div class="item item15">15</div>
    <div class="item item16">16</div>
    <div class="item item17">17</div>
    <div class="item item18">18</div>
    <div class="item item19">19</div>
    <div class="item item20">20</div>
    <div class="item item21">21</div>
    <div class="item item22">22</div>
    <div class="item item23">23</div>
    <div class="item item24">24</div>
    <div class="item item25">25</div>
  </div>

<script>
//Your code goes here 
	
const container = document.querySelector(".items");
const items = document.querySelectorAll(".item");

let selectedItem = null;
let offsetX = 0;
let offsetY = 0;
items.forEach(item => {

    item.addEventListener("mousedown", function(e) {

        selectedItem = item;

        const rect = item.getBoundingClientRect();

        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;

        item.style.zIndex = 100;
    });

});

document.addEventListener("mousemove", function(e) {

    if (!selectedItem) return;

    const rect = selectedItem.parentElement.getBoundingClientRect();

    let x = e.clientX - rect.left - offsetX;
    let y = e.clientY - rect.top - offsetY;

    const itemRect = selectedItem.getBoundingClientRect();

    x = Math.max(0, Math.min(x, rect.width - itemRect.width));
    y = Math.max(0, Math.min(y, rect.height - itemRect.height));

    const originalRect = selectedItem.getBoundingClientRect();

    selectedItem.style.transform =
        `translate(${x - (originalRect.left - rect.left)}px,
                    ${y - (originalRect.top - rect.top)}px)`;
});

document.addEventListener("mouseup", function() {

    if (selectedItem) {
        selectedItem.style.zIndex = "";
        selectedItem = null;
    }

});

</script>

  </body>
</html>
